# Apache vhost for Heimkunnskap. Install as
#   /etc/apache2/sites-available/heimkunnskap.conf
# then follow docs/deploy.md ("Apache"). Port 80 is left to certbot's
# Apache plugin, which adds the HTTP-to-HTTPS redirect.
#
# The web app answers the LAN and WireGuard only. The one exception is
# /mcp, which answers Anthropic's outbound range only and then checks its
# own bearer token. Keep the addresses below in step with
# WEB_ALLOWED_NETWORKS in .env.
<VirtualHost *:443>
    ServerName heim.example.org

    SSLEngine on
    SSLProtocol -all +TLSv1.3
    SSLCertificateFile    /etc/letsencrypt/live/heim.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/heim.example.org/privkey.pem

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set X-Robots-Tag "noindex, nofollow"

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # Everything: home LAN, WireGuard, and the home's public address
    # (LAN clients come back through the router). Replace with the real
    # ranges; add the home IPv6 prefix if heim.example.org has an AAAA record.
    <Location />
        Require ip 192.168.1.0/24 10.8.0.0/24 203.0.113.7
    </Location>

    # The Claude connector: Anthropic's outbound range only
    # (https://platform.claude.com/docs/en/api/ip-addresses), on top of the
    # bearer token. A later <Location> replaces the rule above for this path.
    <Location /mcp>
        Require ip 160.79.104.0/21
    </Location>

    # Grafana (compose profile "grafana"), most specific path first.
    # The live channel is a websocket: needs mod_proxy_wstunnel.
    ProxyPass        /grafana/api/live/ ws://127.0.0.1:3001/grafana/api/live/
    ProxyPass        /grafana/ http://127.0.0.1:3001/grafana/
    ProxyPassReverse /grafana/ http://127.0.0.1:3001/grafana/

    ProxyPass        / http://127.0.0.1:4200/
    ProxyPassReverse / http://127.0.0.1:4200/

    ErrorLog  ${APACHE_LOG_DIR}/heimkunnskap-error.log
    CustomLog ${APACHE_LOG_DIR}/heimkunnskap-access.log combined
</VirtualHost>
