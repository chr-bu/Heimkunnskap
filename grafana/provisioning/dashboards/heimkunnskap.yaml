# Dashboards from files: edits made in Grafana are not kept. Change the
# JSON in the repository instead.
apiVersion: 1
providers:
  - name: heimkunnskap
    folder: Heimkunnskap
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/json
