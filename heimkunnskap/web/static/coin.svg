<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 4.5 60 60">
  <!-- Heimkunnskap: a gold coin, tilted a little to show its edge -->
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5a00"/>
      <stop offset="0.35" stop-color="#c98a0b"/>
      <stop offset="0.6" stop-color="#e0a722"/>
      <stop offset="1" stop-color="#7a4e00"/>
    </linearGradient>
    <radialGradient id="face" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#fff6c4"/>
      <stop offset="0.35" stop-color="#ffd34d"/>
      <stop offset="0.75" stop-color="#e8a614"/>
      <stop offset="1" stop-color="#b87a05"/>
    </radialGradient>
    <radialGradient id="inner" cx="0.62" cy="0.7" r="0.8">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="0.6" stop-color="#f2b929"/>
      <stop offset="1" stop-color="#cf9210"/>
    </radialGradient>
  </defs>
  <!-- the edge: the face's outline repeated a few pixels lower -->
  <ellipse cx="32" cy="38" rx="28" ry="23" fill="url(#edge)"/>
  <path d="M4 33v5c0 12.7 12.5 23 28 23s28-10.3 28-23v-5" fill="url(#edge)"/>
  <g stroke="#6b4300" stroke-opacity="0.35" stroke-width="1">
    <path d="M10 47.5v4M16 52v4.2M23 55v4.3M32 56v4.4M41 55v4.3M48 52v4.2M54 47.5v4"/>
  </g>
  <!-- the face -->
  <ellipse cx="32" cy="33" rx="28" ry="23" fill="url(#face)"/>
  <!-- raised rim and sunken centre -->
  <ellipse cx="32" cy="33" rx="22" ry="17.6" fill="url(#inner)" stroke="#a86d00" stroke-opacity="0.55" stroke-width="1.5"/>
  <ellipse cx="32" cy="33.6" rx="22" ry="17.6" fill="none" stroke="#fff3b0" stroke-opacity="0.6" stroke-width="1"/>
  <!-- an embossed H -->
  <g transform="translate(32 33) scale(1 0.82)">
    <path d="M-9-11h5v8.5h8V-11h5v22h-5v-8.5h-8V11h-5z" fill="#a86d00" opacity="0.55" transform="translate(0.9 1.2)"/>
    <path d="M-9-11h5v8.5h8V-11h5v22h-5v-8.5h-8V11h-5z" fill="#ffe680"/>
  </g>
  <!-- a glint -->
  <path d="M15 22c4-6 10-9 17-9.5" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
