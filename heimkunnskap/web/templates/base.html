<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}Heimkunnskap{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/coin.svg" type="image/svg+xml">
  <link rel="icon" href="/static/coin-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Heimkunnskap</a>
    <nav><a href="/">Overview</a> <a href="/categories">Categories</a> <a href="/upload">Uploads</a> <a href="/tax">Tax</a> <a href="/business">Business</a> <a href="/points">Points</a> <a href="/groceries">Groceries</a></nav>
    <span class="version">{{ version }}</span>
  </header>
  <main>
    {% for kind, message in flashes %}<div class="flash {{ kind }}">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
